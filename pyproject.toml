[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "1.0.0"
description = "AI CLI с инструментами и разными провайдерами"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "openai>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
claude = ["anthropic>=0.39"]
g4f = ["g4f"]

[project.scripts]
ai-cli = "aicli.cli:main"

[tool.setuptools.packages.find]
include = ["aicli*"]
